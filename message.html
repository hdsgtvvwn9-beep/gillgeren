<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="经纬校园留言板演示页面，仅在浏览器本地保存。">
  <title>林舟 | 留言板</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23091017'/%3E%3Cpath d='M16 18h32v6H16zm0 11h24v6H16zm0 11h32v6H16z' fill='%2359e0bd'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="mobile.css">
  <script src="app.js" defer></script>
</head>
<body data-page="message">
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span><span>LIN ZHOU</span></a>
    <nav class="desktop-nav" aria-label="主导航"><a href="index.html">首页</a><a href="works.html">作品与能力</a><a class="active" href="message.html">留言板</a></nav>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="mobile-nav">菜单</button>
  </header>
  <nav class="mobile-nav" id="mobile-nav" aria-label="移动端导航" hidden><a href="index.html">首页</a><a href="works.html">作品与能力</a><a href="message.html">留言板</a></nav>

  <main class="shell inner-main message-layout">
    <section class="message-copy reveal">
      <p class="eyebrow">MESSAGE BOARD</p>
      <h1>留下想法<br><span>但不留下隐私</span></h1>
      <p>这是留言板的前端预留功能。内容仅保存在当前浏览器中，不连接服务器，不要求真实姓名、电话、邮箱或其他身份信息。</p>
      <ul class="privacy-list"><li><i></i>使用化名即可</li><li><i></i>最多 200 字</li><li><i></i>浏览器本地保存</li></ul>
    </section>

    <section class="message-board reveal" aria-labelledby="form-title">
      <div class="board-header"><div><p class="eyebrow">LOCAL DEMO</p><h2 id="form-title">发布留言</h2></div><span class="privacy-badge">不上传服务器</span></div>
      <form id="message-form">
        <label for="nickname">化名</label>
        <input id="nickname" name="nickname" maxlength="12" placeholder="例如：微光同学" required>
        <div class="label-row"><label for="message">留言内容</label><output id="counter" for="message">0 / 200</output></div>
        <textarea id="message" name="message" rows="5" maxlength="200" placeholder="分享建议、学习感受或校园体验……" required></textarea>
        <button class="button primary submit-button" type="submit">保存到本地留言板</button>
        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
      </form>
      <div class="message-list-heading"><h3>最近留言</h3><button id="clear-messages" class="text-button" type="button">清空本地留言</button></div>
      <div id="message-list" class="message-list" aria-live="polite"></div>
    </section>
  </main>
  <footer class="site-footer shell"><div><strong>林舟的个人主页</strong><p>Web 页面设计课程实验</p></div><div class="student-meta"><span>制作者：林舟（化名）</span><span>学号后两位：07</span></div></footer>
</body>
</html>
